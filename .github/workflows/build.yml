# 맥·윈도우에서 Gradle 빌드·테스트, 설치파일(.dmg/.msi) 생성 (docs/설계.md 8장 M1)
name: 빌드

on:
  pull_request:
  push:
    branches: [main, develop]

permissions:
  contents: read

jobs:
  build:
    name: 빌드 (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"

      - uses: gradle/actions/setup-gradle@8da46b539cd8fe6ab27ca75128919a18d757604c # v6.4.1

      - name: 빌드·테스트
        shell: bash # 윈도우에서도 같은 gradlew 스크립트를 쓴다(Git Bash)
        run: ./gradlew build --console=plain

      # 설치파일은 실행 아티팩트로만 올린다. Releases에는 올리지 않는다(D-024).
      - name: 설치파일 만들기
        shell: bash
        # 윈도우 MSI는 버전이 같으면 같은 제품으로 보고 덮어 설치하지 않는다. 실행마다 버전을 올린다.
        run: ./gradlew jpackage -PappVersion=1.0.${{ github.run_number }} --console=plain

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: koja-${{ runner.os }}
          path: app/build/jpackage/*
          if-no-files-found: error
          retention-days: 14
